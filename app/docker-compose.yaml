services:

  postgres:

    image: postgres:17

    container_name: postgres-db

    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:

    build: .

    container_name: bank-screening-container

    ports:
      - "8000:8000"

    environment:
      DB_NAME: bankdb
      DB_USER: bankuser
      DB_PASSWORD: bankpass
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      - postgres

volumes:
  postgres_data: